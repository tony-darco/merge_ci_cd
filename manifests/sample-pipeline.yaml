apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: sample-pipeline-
spec:
  entrypoint: test
  arguments:
    parameters:
      - name: image
      # Read back by agent/context_builder.py from the workflow's own spec,
      # so the exit-handler pod never needs a host git checkout to learn
      # what commit failed or what it touched.
      - name: commit-sha
        value: ""
      - name: changed-files
        value: ""
  # Fires the agent only on failure. `spec.hooks.exit` with an expression
  # states that condition natively, rather than an onExit template that
  # always runs and then filters itself (DECISIONS.md #18).
  hooks:
    exit:
      expression: "workflow.status == 'Failed'"
      templateRef:
        name: run-agent-wft
        template: main
      arguments:
        parameters:
          - name: commit-sha
            value: "{{workflow.parameters.commit-sha}}"
          - name: image
            value: "{{workflow.parameters.image}}"
  templates:
    - name: test
      container:
        image: "{{workflow.parameters.image}}"
        imagePullPolicy: Never
        command: ["pytest", "-q"]
    # Resource quantities are validated against a strict regex at workflow
    # parse time, before {{workflow.parameters...}} substitution runs (see
    # LOG.md) -- so the OOM seed gets its own template with a hardcoded
    # limit, selected via `argo submit --entrypoint`, instead of a
    # parameterized memory value.
    - name: test-oom-limited
      container:
        image: "{{workflow.parameters.image}}"
        imagePullPolicy: Never
        command: ["pytest", "-q"]
        resources:
          limits:
            memory: "16Mi"
