[project]
name = "agentic-cicd-fixer"
version = "0.1.0"
description = "Agentic layer on top of Argo Workflows that diagnoses, fixes, and verifies CI pipeline failures"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "unidiff>=0.7",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
# Live tests hit real external systems (GitHub, a running cluster) and have
# real side effects, so they never run in a bare `pytest`. Opt in with
# `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: hits real external systems and has real side effects (opt in with -m live)",
]
